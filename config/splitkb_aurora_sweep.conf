# Uncomment these two line to add support for encoders to your firmware
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Kyria OLED Display
# CONFIG_ZMK_DISPLAY=y

# Uncomment the following lines to enable RGB underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y

CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
# Enable experimental Bluetooth connection parameters
#CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
# Force the internal RC oscillator to bypass crystal timing drift
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
# Tell the BLE stack to expect up to 500 Parts Per Million (PPM) of clock drift
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
# Allow the keyboard to skip up to 2 check-ins before the host panics
CONFIG_BT_PERIPHERAL_PREF_LATENCY=2

# Force the OS to wait a full 4 seconds (400 * 10ms) before disconnecting
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400