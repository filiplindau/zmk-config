# Expect 2 peripherals (Left and Right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Enable split keyboard support
CONFIG_ZMK_SPLIT=y

# Force the dongle to act as the Central brain
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Keep the dongle awake to maintain the PC connection
CONFIG_ZMK_SLEEP=n

# Force a custom Bluetooth name
CONFIG_ZMK_KEYBOARD_NAME="Sweep Dongle"

# Give the display its own dedicated background thread
#CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
#CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# Increase the main system and heap memory for LVGL 9
#CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
#CONFIG_MAIN_STACK_SIZE=4096
#CONFIG_HEAP_MEM_POOL_SIZE=8192

# Increase the log buffer so it doesn't get cut off
#CONFIG_LOG_BUFFER_SIZE=8192

# Wait 8 seconds after plugging in before dumping logs
# (This gives you time to open your serial monitor)
#CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

# Explicitly allocate memory for 1 PC connection + 2 peripherals
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_DISPLAY=y
# ZMK's built-in way to make the nice!view background black
CONFIG_ZMK_DISPLAY_INVERT=y

#CONFIG_LV_USE_THEME_DEFAULT=y
#CONFIG_LV_THEME_DEFAULT_DARK=y

