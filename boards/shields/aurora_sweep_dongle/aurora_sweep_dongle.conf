# Expect 2 peripherals (Left and Right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Enable split keyboard support
CONFIG_ZMK_SPLIT=y

# Keep the dongle awake to maintain the PC connection
CONFIG_ZMK_SLEEP=n

# Force a custom Bluetooth name
CONFIG_ZMK_KEYBOARD_NAME="Sweep Dongle"

# Increase the log buffer so it doesn't get cut off
CONFIG_LOG_BUFFER_SIZE=8192

# Wait 8 seconds after plugging in before dumping logs
# (This gives you time to open your serial monitor)
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

# Explicitly allocate memory for 1 PC connection + 2 peripherals
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3