description: Contextual Magic Key
compatible: "zmk,behavior-contextual"

# THE FIX: Point to ZMK's actual base file for 0-parameter behaviors
include: zero_param.yaml

properties:
  fallback:
    type: int
    required: true
    description: The default keycode to output if no match is found (e.g., SPACE)

  map:
    # THE FIX: Zephyr uses 'array' for integer arrays, not 'int-array'
    type: array
    required: true
    description: Array of keycode pairs (match, output). E.g., <Q U  T H>